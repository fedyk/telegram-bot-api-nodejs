name: Weekly sync check

on:
  schedule:
    # Every Monday at 07:17 UTC.
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm build
      - run: npm run sync
      - name: Fail if syncing leaves uncommitted changes
        shell: bash
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [ -n "$changes" ]; then
            echo "::error::Sync found changes. Run npm run sync locally and commit the updated files."
            printf '%s\n' "$changes"
            git diff --stat HEAD
            git diff HEAD
            exit 1
          fi
