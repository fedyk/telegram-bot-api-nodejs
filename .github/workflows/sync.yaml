name: sync

on:
  push:
  schedule:
    - cron: "0 7 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - run: npm ci
    - run: npm run build
    - run: npm run sync
    - name: git diff
      id: check_changes
      run: git diff --quiet || echo "::set-output name=changes_detected::true"
    - name: sync
      if: steps.check_changes.outputs.changes_detected == 'true'
      run: |
        npm run test
        npm run spec
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "update currencies.json"
        npm version patch
        git push
        git push --tags
      env:
        TOKEN: ${{ secrets.TOKEN }}
